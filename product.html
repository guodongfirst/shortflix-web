      <p>桃子小剧是本公司的短剧 App。目前能做这几件事：</p>
      <ul>
        <li>浏览、播放短剧</li>
        <li>收藏，观看进度保存在本机</li>
        <li>不注册也可以用。清掉 App 数据之后，本机记录找不回来</li>
        <li>在「我的 — 用户反馈」里提意见</li>

      <p>金币、现金显示和任务奖励都按 App 页面上的规则来，不能转给别人，也不是充进去的余额。提现要看页面上的条件，以及当时能不能走到支付渠道。</p>
